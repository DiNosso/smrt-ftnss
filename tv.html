<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMRT.FTNSS · TV</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Ontworpen voor 1280x720 op een Chromecast, schaalt mee naar 4K. */
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--background); }
  .screen { height: 100vh; display: flex; flex-direction: column; padding: 3vmin 4vmin; gap: 2vmin; }
  .top { display: flex; align-items: baseline; gap: 2vmin; }
  .top .brand { font-family: var(--font-display); font-size: clamp(1rem, 2.6vmin, 2rem); color: var(--primary); letter-spacing: .04em; display: flex; align-items: center; gap: .5em; }
  .top .brand img { height: 1em; width: 1em; }
  .top .sess { font-size: clamp(.8rem, 2vmin, 1.4rem); color: var(--text-dim); }
  .top .clock { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text-dim); font-size: clamp(.9rem, 2.2vmin, 1.6rem); }
  .main { flex: 1; display: flex; gap: 3vmin; min-height: 0; align-items: stretch; }
  /* Verhouding komt uit het beeld zelf (script); vierkant is de gangbare Vital-maat. */
  .vid { flex: 0 0 auto; height: 100%; aspect-ratio: 1/1; max-width: 48%; border-radius: 2vmin; overflow: hidden; background: #f3f4f3; position: relative; }
  .vid.wide { aspect-ratio: 3/2; max-width: 52%; }
  .vid video, .vid img { position: absolute; inset: 6%; width: 88%; height: 88%; object-fit: contain; }
  .info { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 1.6vmin; min-width: 0; }
  .exname { font-family: var(--font-display); font-size: clamp(1.6rem, 6.4vmin, 5rem); line-height: 1.03; }
  .scheme { font-size: clamp(1.3rem, 5vmin, 3.6rem); font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .meta { font-size: clamp(.85rem, 2.4vmin, 1.6rem); color: var(--text-dim); }
  .big { font-family: var(--font-display); font-size: clamp(3rem, 20vmin, 15rem); line-height: .95; color: var(--accent); font-variant-numeric: tabular-nums; }
  .next { margin-top: 1vmin; padding-top: 1.4vmin; border-top: 1px solid var(--border); font-size: clamp(.75rem, 2.1vmin, 1.4rem); color: var(--text-faint); }
  .next b { color: var(--text-dim); font-weight: 600; }
  .bar { height: .8vmin; background: rgba(255,255,255,.08); border-radius: 1vmin; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--secondary), var(--accent)); transition: width .4s ease; }
  /* Koppelscherm */
  .pair { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vmin; text-align: center; padding: 4vmin; }
  .pair h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 5vmin, 3.4rem); margin: 0; }
  .pair p { color: var(--text-dim); font-size: clamp(.9rem, 2.4vmin, 1.5rem); max-width: 60ch; margin: 0; }
  .code { display: flex; gap: 1.5vmin; }
  .code span {
    width: 7vmin; height: 9vmin; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: clamp(1.4rem, 5vmin, 3.5rem);
    border: .3vmin solid var(--border); border-radius: 1.4vmin; background: var(--surface-2);
  }
  .code span.on { border-color: var(--accent); color: var(--accent); }
  .status { position: fixed; right: 2vmin; bottom: 1.6vmin; font-size: clamp(.6rem, 1.5vmin, 1rem); color: var(--text-faint); }
  .status.bad { color: var(--danger); }
  .idle { opacity: .45; }
</style>
</head>
<body>
<div id="root"></div>
<div class="status" id="status">verbinden…</div>
<!-- Eén ES2017-bundel: draait ook op de oudere Chrome van een Chromecast-stick,
     waar ES-modules en optional chaining het scherm zwart zouden laten. -->
<script src="js/tv.bundle.js"></script>
</body>
</html>
