<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>SMRT.FTNSS</title>
  <meta name="description" content="Persoonlijke trainingsapp — hypertrofie thuis, slim gepland rond je andere sporten.">
  <meta name="theme-color" content="#050a09">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SMRT.FTNSS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app"></main>
  <nav class="tabbar" id="tabbar"></nav>
  <script src="js/vendor/mqtt.min.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // Stond de app al onder beheer van een service worker? Zo ja, dan is een
      // wisseling van worker een nieuwe versie en verversen we eenmalig.
      var hadController = !!navigator.serviceWorker.controller;
      var reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController || reloading) return;   // eerste installatie: niets te verversen
        reloading = true;
        location.reload();
      });
      addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          reg.update();
          // iOS controleert uit zichzelf nauwelijks op updates. Doe het daarom
          // elke keer dat de app weer op de voorgrond komt.
          document.addEventListener('visibilitychange', function () {
            if (!document.hidden) reg.update();
          });
          // Staat er al een nieuwe versie te wachten? Laat 'm meteen overnemen.
          if (reg.waiting) reg.waiting.postMessage('skipWaiting');
          reg.addEventListener('updatefound', function () {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', function () {
              if (nw.state === 'installed' && reg.waiting) reg.waiting.postMessage('skipWaiting');
            });
          });
        });
      });
    }
  </script>
</body>
</html>
